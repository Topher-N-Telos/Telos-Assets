name = "telos-echo-api"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[durable_objects.bindings]]
name = "USER_STATE"
class_name = "UserState"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserState", "Ledger"]

# Non-secret settings. Secrets (OPENAI_API_KEY, OWNER_EMAIL, ALLOWED_EMAILS, ACCESS_TEAM_DOMAIN, ACCESS_AUD)
# are set in the Cloudflare dashboard / `wrangler secret put` and never live in this file.
# DEV_BYPASS_AUTH must never be set here.
[vars]
MAX_USD_PER_DAY = "2"
MAX_USD_PER_MONTH = "6"
MAX_CALLS_PER_DAY_USER = "8"
FREE_AVATAR_GENERATIONS = "2"
FREE_TELO_GENERATIONS = "2"
TIME_ZONE = "America/Detroit"
